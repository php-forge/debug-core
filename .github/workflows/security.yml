---
on:
  - pull_request
  - push

name: security

permissions:
  contents: read

jobs:
  security:
    uses: yii2-framework/actions/.github/workflows/security.yml@b89c19ef18bc9e6f0fcc9cd6aa211d700576b718 # v2.0.1
    permissions:
      contents: read
    with:
      gitleaks-config: .github/linters/.gitleaks.toml
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
