---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: build

permissions:
  contents: read

jobs:
  phpunit:
    uses: yii2-framework/actions/.github/workflows/phpunit.yml@b68d580983ad61b2d45d1b6568fe8af9cc4dfd95 # v2.0.1
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      concurrency-group: phpunit-${{ github.workflow }}-${{ github.ref }}
      extensions: intl, mbstring
      php-version: '["8.3","8.4","8.5"]'
